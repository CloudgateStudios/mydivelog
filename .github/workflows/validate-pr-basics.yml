name: Validate PR Basics

on:
  pull_request:
    branches: [main]
    # `edited` is required: without it, retitling a PR to fix a failing title
    # check never re-runs the check. The default types are opened, synchronize
    # and reopened only.
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Least privilege: neither job writes anything back to the repository.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-basics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            refactor
            test
            ci
            chore
            revert
          requireScope: false

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run spell check
        run: npm run spellcheck
