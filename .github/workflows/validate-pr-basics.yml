name: Validate PR Basics

on:
  pull_request:
    branches: [main]
    # `edited` is required: without it, retitling a PR to fix a failing title
    # check never re-runs the check. The default types are opened, synchronize
    # and reopened only.
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Least privilege: neither job writes anything back to the repository.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-basics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a moving tag on a third-party action is a
      # supply-chain surface. Dependabot keeps it current.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The full Conventional Commits set. build, perf and style were
          # missing, and build is already in use — "build: upgrade to pnpm 11" —
          # so a single-commit PR using it would have failed this check, as
          # would Dependabot's base-image updates.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack ships with Node and activates the version pinned in
      # packageManager. pnpm/action-setup was doing this via `npm install`,
      # which costs 2-3 minutes on the runner — two minutes for five packages —
      # and does so whenever the pinned and installed versions differ at all.
      # `standalone: true` did not help: it changes which package npm installs,
      # not that npm installs it.
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # Cache the pnpm store by hand: setup-node's built-in pnpm cache has to
      # run before this step, when pnpm is not yet on PATH.
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spell check
        run: pnpm spellcheck
