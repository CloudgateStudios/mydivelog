name: Conventional Commits

on:
  pull_request:
    branches: [main]
    # `edited` matters: retitling a PR must re-run the check.
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check title follows Conventional Commits
        env:
          # PR titles are untrusted input. Pass them through the environment
          # instead of interpolating `${{ }}` into the shell, which would let a
          # crafted title execute commands in this job.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          subjects=$(printf 'PR title\t%s' "$PR_TITLE")

          # This repository squash-merges with squash_merge_commit_title set to
          # COMMIT_OR_PR_TITLE, so a PR with exactly one commit puts that
          # commit's subject on main rather than the PR title. Check it too, so
          # main's history stays conventional whichever one GitHub picks.
          if [ "$PR_COMMIT_COUNT" = "1" ]; then
            commit_subject=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
              --jq '.[0].commit.message | split("\n")[0]')
            subjects=$(printf '%s\nCommit subject\t%s' "$subjects" "$commit_subject")
          fi

          printf '%s' "$subjects" | .github/scripts/check-conventional-title.sh
