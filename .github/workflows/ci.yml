name: CI

on:
  # Every pull request, not only those targeting main. A branch stacked on
  # another feature branch was getting no CI at all — the checks silently did
  # not exist rather than failing, which is the worst way for them to be absent.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A full pass costs about twenty billable minutes, and roughly ten of those
  # were four container builds re-running because somebody edited a paragraph.
  # This works out what a pull request actually touched so the expensive jobs
  # can sit out the ones that cannot affect them.
  #
  # Two rules keep it from turning into a hole:
  #
  #   1. Everything runs on `main`, always. A filter that is too narrow then
  #      costs one red build at merge rather than silence — which is the
  #      failure mode that matters, because a check that never runs protects
  #      nothing. This repository has been bitten by exactly that: the API's
  #      integration tests were excluded by a shell glob and nobody noticed
  #      for weeks.
  #   2. The filters are deliberately generous. Skipping a job that would have
  #      passed saves nothing worth having.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      images: ${{ steps.filter.outputs.images }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the comparison have to be present locally.
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A push to main runs the lot. See rule 1 above.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "code=true"
              echo "images=true"
              echo "web=true"
            } >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running everything."
            exit 0
          fi

          # If the comparison cannot be made — a base that is not in this
          # clone, a shallow fetch, anything unforeseen — run everything. The
          # failure mode of a filter must be doing too much work, never
          # quietly doing none.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); then
            {
              echo "code=true"
              echo "images=true"
              echo "web=true"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Could not diff $BASE..$HEAD — running everything."
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # `grep -q` exits non-zero when nothing matches, which is a normal
          # outcome here and not a failure.
          matches() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }

          # Anything that is not prose. Documentation cannot break a build, and
          # the spell check and secret scan below still run on it regardless.
          # `grep -v` asks whether any changed file is *not* documentation,
          # which is the question. A lookahead would be the obvious way to
          # write it and grep -E has none.
          code=$(printf '%s\n' "$changed" | grep -qvE '^(docs/|\.cspell/|[^/]*\.md$)' && echo true || echo false)

          # What can actually break a container: its Dockerfile, the set of
          # packages it installs, or a workspace dependency it now needs
          # copied in. A .tsx edit inside an app that already builds cannot.
          # Adding @mydivelog/contracts to the web app needed two new COPY
          # lines, and that arrived as a package.json change.
          images=$(matches '(Dockerfile|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)')

          # The accessibility suite drives real pages of both apps against a
          # real API, so anything any of them is built from counts.
          web=$(matches '^(apps/(web|api|admin)/|packages/(domain|contracts|db|importers)/|e2e/|playwright\.config\.ts$|lighthouserc\.json$|\.github/workflows/ci\.yml$)')

          {
            echo "code=$code"
            echo "images=$images"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code images=$images web=$web"

  verify:
    name: Lint, typecheck, test, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # corepack ships with Node and activates the version pinned in
      # packageManager. pnpm/action-setup was doing this via `npm install`,
      # which costs 2-3 minutes on the runner — two minutes for five packages —
      # and does so whenever the pinned and installed versions differ at all.
      # `standalone: true` did not help: it changes which package npm installs,
      # not that npm installs it.
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # Cache the pnpm store by hand: setup-node's built-in pnpm cache has to
      # run before this step, when pnpm is not yet on PATH.
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No turbo cache on purpose. Its key was the commit SHA, so every run
      # wrote a new ~114 MB entry, and post-job upload took 5-9 minutes against
      # a full cold build of well under a minute. The cache cost far more than
      # it saved. Dependency caching above is the one that pays, and it hits.
      #
      # If build times ever justify it, use Turbo remote caching rather than
      # shipping .turbo through actions/cache.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A real Postgres, because these tests exist to check things a fake cannot:
    # that revert restores a dive from provenance rows that survived in the
    # database, and that a partial unique index actually rejects a duplicate.
    # Asserting those against a mock proves only that the mock agrees with me.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mydivelog
          POSTGRES_PASSWORD: mydivelog
          POSTGRES_DB: mydivelog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mydivelog -d mydivelog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mydivelog:mydivelog@127.0.0.1:5432/mydivelog
      DIRECT_DATABASE_URL: postgresql://mydivelog:mydivelog@127.0.0.1:5432/mydivelog
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates the Prisma client and builds @mydivelog/db's workspace
      # dependencies. Both are prerequisites the first version of this job
      # left out, because a developer machine always has them already — the
      # generated client is gitignored and the domain package's dist is a
      # build artifact, so a clean checkout has neither.
      - name: Build dependencies and generate the client
        run: pnpm turbo run build --filter=@mydivelog/db... --filter=@mydivelog/api...

      # The same command the Fly release command runs, against a fresh
      # database. A migration that only works on an already-migrated database
      # passes locally forever and fails on the first real deploy.
      - name: Apply migrations
        run: pnpm --filter @mydivelog/db db:deploy

      # Reference data the API's tag resolution expects. Left out, the tests
      # still pass but exercise the "no system tags" path only.
      - name: Seed reference data
        run: pnpm --filter @mydivelog/db db:seed

      - name: Run integration tests
        run: |
          pnpm --filter @mydivelog/db test:integration
          pnpm --filter @mydivelog/api test:integration
        env:
          AUTH_ACCESS_SECRET: integration-tests-only-not-a-real-secret-value

  accessibility:
    name: Accessibility and Lighthouse
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser is most of this job's install time, and it only changes
      # when Playwright does.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      # The same stack the runbook starts, from the same compose file and the
      # same .env.example. A CI-only approximation of the environment would
      # measure a page nobody runs.
      - name: Start Postgres and object storage
        run: |
          cp .env.example .env
          pnpm services:up

      - name: Build
        run: pnpm build

      - name: Apply migrations and seed reference data
        run: pnpm db:deploy && pnpm db:seed

      # Production builds, not `next dev`. A development server is several
      # times slower to respond and compiles on demand, so a performance score
      # taken against it measures the dev server rather than the site.
      - name: Start the API, the site and the staff panel
        run: |
          pnpm --filter @mydivelog/api start > /tmp/api.log 2>&1 &
          pnpm --filter @mydivelog/web start > /tmp/web.log 2>&1 &
          pnpm --filter @mydivelog/admin start > /tmp/admin.log 2>&1 &
          for i in $(seq 1 90); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:53001/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:53000/ || true)
            adm=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:53002/ || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ] && [ "$adm" = "200" ]; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come up"
          tail -40 /tmp/api.log /tmp/web.log /tmp/admin.log
          exit 1

      # Real dives, so the accessibility checks run against a page with content
      # in it. An empty logbook has no table, no filters worth applying and no
      # depth profile -- it would pass every check by having nothing to fail.
      - name: Load the sample logbook
        run: pnpm demo

      # Both apps, both colour schemes. The palette is defined in two themes,
      # and until this ran twice only one of them was ever exercised — which
      # is how a primary button shipped at 1.9:1 against its own background
      # after dark.
      - name: WCAG 2.2 AA on the primary flows
        run: pnpm test:a11y

      - name: Lighthouse on the marketing pages
        run: pnpm test:lighthouse

      - name: Keep the evidence when something fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-run
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

  images:
    name: Container images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web, admin]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # The deploy builds these; until this job existed, nothing before it did.
      # A base-image bump to node:26 removed corepack and broke every image,
      # and CI was green the whole way to production.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: mydivelog-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Building is not enough: an image can build and still fail to boot.
      - name: Check it serves health
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          path=/health
          case "$SERVICE" in web|admin) path=/api/health ;; esac
          # The API refuses to boot without a signing secret or a database URL,
          # which is intended: a deployed environment must never sign sessions
          # with a default, and a missing DATABASE_URL should stop the process
          # rather than surface later as a confusing query error. Both values
          # here are throwaway and exist only so the container starts — /health
          # is a liveness check and touches neither.
          docker run -d --rm --name check -p 8080:8080 \
            -e AUTH_ACCESS_SECRET=ci-only-throwaway-secret-not-used-anywhere-else \
            -e DATABASE_URL=postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder \
            "mydivelog-${SERVICE}:ci"
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 5 "http://localhost:8080${path}" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "\"service\":\"${SERVICE}\""; then
              echo "ok  $SERVICE -> $body"
              docker stop check >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::${SERVICE} image did not serve ${path}"
          docker logs check 2>&1 | tail -30
          docker stop check >/dev/null
          exit 1

  fixtures:
    name: Fixture integrity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The fixtures exist to carry real-world data hazards. Someone "tidying
      # up" a fixture would silently disarm the import engine's tests, and the
      # loss would not show up until Phase 3 regressions slipped through.
      - name: Assert data hazards are still present
        run: |
          set -euo pipefail
          fail=0
          check() {
            if grep -qE "$2" "$3"; then
              echo "ok   $1"
            else
              echo "::error file=$3::Fixture hazard removed: $1"
              fail=1
            fi
          }
          check "spreadsheet: non-numeric dive number" '^x,'              fixtures/spreadsheet-sample.csv
          check "spreadsheet: N/A used as a null"      ',N/A,'            fixtures/spreadsheet-sample.csv
          check "spreadsheet: typo 'Dift' for drift"   'Dift'             fixtures/spreadsheet-sample.csv
          check "spreadsheet: comma inside a value"    '"1,000 Steps"'    fixtures/spreadsheet-sample.csv
          check "uddf: malformed UTC offset"           '\-00:0[456]'      fixtures/uddf-sample.uddf
          check "uddf: leadquantity sentinel"          'leadquantity>0.0' fixtures/uddf-sample.uddf
          check "uddf: site name equal to opaque id"   '<name>site_'      fixtures/uddf-sample.uddf
          exit $fail

      - name: Assert the two fixtures still overlap
        run: |
          set -euo pipefail
          # Without shared dates there is no merge case, which is the entire
          # reason both files are committed.
          if ! grep -q "2026-03" fixtures/uddf-sample.uddf; then
            echo "::error::UDDF fixture no longer covers the overlap window"
            exit 1
          fi
          echo "ok   fixtures share the 2026-03 window"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI rather than the marketplace action: the action requires
      # a paid license key for organization-owned repositories, the CLI does not.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner
