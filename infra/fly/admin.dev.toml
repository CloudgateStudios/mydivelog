# Deploy from the repository root — the Dockerfile needs the whole workspace
# as build context:
#
#   fly deploy . --config infra/fly/admin.dev.toml \
#     --dockerfile apps/admin/Dockerfile --app mydivelog-admin-dev

app = "mydivelog-admin-dev"
primary_region = "ord"

[env]
  APP_ENV = "dev"
  # Staff changes go through the API, never straight to the database, so the
  # panel needs to know where the API is. Internal, over Fly's private network:
  # this call carries a Cloudflare Access token and has no business leaving the
  # organisation to come back in.
  API_URL = "http://mydivelog-api-dev.internal:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
