# Deploy from the repository root — the Dockerfile needs the whole workspace
# as build context:
#
#   fly deploy . --config infra/fly/admin.dev.toml \
#     --dockerfile apps/admin/Dockerfile --app mydivelog-admin-dev

app = "mydivelog-admin-dev"
primary_region = "ord"

[env]
  APP_ENV = "dev"

# API_URL is a Fly secret, not an entry above.
#
# Staff changes go through the API rather than straight to the database, so the
# panel does need to know where the API is — but this repository is public, and
# the address of an internal service is not something to publish just because
# it is convenient to have it in version control.
#
# Keeping it a secret also means the value can move — public hostname today,
# `http://mydivelog-api-dev.internal:8080` over Fly's private network if that
# round trip is ever worth removing — without a deploy or a commit.
#
#   fly secrets set --app mydivelog-admin-dev API_URL=...
#
# `apps/admin/lib/api.ts` warns at startup when it is missing in a deployed
# environment, because a panel that has quietly fallen back to localhost looks
# exactly like a working one until somebody presses a button.

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
