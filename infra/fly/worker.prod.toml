# Deploy from the repository root:
#
#   fly deploy . --config infra/fly/worker.prod.toml \
#     --dockerfile apps/worker/Dockerfile --ha=false --flycast --no-public-ips --app mydivelog-worker-prod
#
# Private Flycast service: allocate a private IPv6 and no public IPs.
# The current worker only serves health checks. Future queue consumers must
# explicitly wake it and keep requests active while jobs run; queue activity
# alone does not wake a suspended machine or prevent proxy suspension.

app = "mydivelog-worker-prod"
primary_region = "ord"

[env]
  APP_ENV = "prod"
  WORKER_PORT = "8080"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = false
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
