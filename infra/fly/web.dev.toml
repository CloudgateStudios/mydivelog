# Deploy from the repository root — the Dockerfile needs the whole workspace
# as build context:
#
#   fly deploy . --config infra/fly/web.dev.toml \
#     --dockerfile apps/web/Dockerfile --app mydivelog-web-dev

app = "mydivelog-web-dev"
primary_region = "ord"

[env]
  APP_ENV = "dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
