# Deploy from the repository root — the Dockerfile needs the whole workspace
# as build context:
#
#   fly deploy . --config infra/fly/api.prod.toml \
#     --dockerfile apps/api/Dockerfile --ha=false --app mydivelog-api-prod

app = "mydivelog-api-prod"
primary_region = "ord"

[env]
  API_PORT = "8080"
  APP_ENV = "prod"
  # Public URL, not a secret. Sign-in links and the OAuth callback redirect are
  # built from it; without it they point at localhost.
  WEB_URL = "https://mydivelog.app"

# Migrations run here, once, before any machine serves the new image. A failure
# aborts the deploy rather than leaving new code against an old schema — which
# is exactly what happened when this was only a comment in the CI workflow.
#
# It belongs in the Fly config rather than in CI so that a manual `fly deploy`
# from a laptop cannot skip it, and so the database URL never needs to exist as
# a GitHub secret.
#
# The path is where `pnpm deploy --prod` lands the db package inside the image;
# the Prisma CLI is a runtime dependency of that package for this reason.
#
# The seed follows the migration. It is idempotent — every row upserts under a
# deterministic id — and touches only system-owned reference data: agencies,
# the tag taxonomy, gas mixes and regions. Without it no deployed environment
# has a tag taxonomy, so import mints a private copy of `shore` for every
# diver and a shared vocabulary stops being shared.
#
# It runs from `dist`, not from `prisma/seed.ts`: the package lands under
# node_modules in the image and Node will not strip types from TypeScript
# there.
#
# The migration is retried, because reaching the database is the step most
# likely to fail for a reason that has nothing to do with the deploy. Neon's
# compute suspends when idle, and Prisma's default connect timeout is five
# seconds — `migrate status` from a running machine takes 4.1s warm, so a cold
# start goes over and the deploy aborts with P1001 on a perfectly good image.
# That is what happened on 2026-09-08.
#
# Five attempts, five seconds apart: about fifty seconds of tolerance, which is
# far more than a cold start needs and still short enough that a genuinely
# unreachable database fails the deploy rather than hanging it. It does still
# fail — `exit 1` after the last attempt, so a real problem aborts as before
# and the seed never runs against a schema that was not migrated. A retry that
# swallowed the failure would be worse than no retry, so both paths are
# exercised in the pull request that added this.
[deploy]
  release_command = "sh -c 'cd node_modules/@mydivelog/db && n=0; until node_modules/.bin/prisma migrate deploy; do n=$((n+1)); [ $n -ge 5 ] && echo \"migrate failed $n times\" && exit 1; echo \"database unreachable, retry $n in 5s\"; sleep 5; done && node dist/seed-cli.js'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
