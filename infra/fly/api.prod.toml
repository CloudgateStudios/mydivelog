# Deploy from the repository root — the Dockerfile needs the whole workspace
# as build context:
#
#   fly deploy . --config infra/fly/api.prod.toml \
#     --dockerfile apps/api/Dockerfile --app mydivelog-api-prod

app = "mydivelog-api-prod"
primary_region = "ord"

[env]
  API_PORT = "8080"
  APP_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 2

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
