services:
  postgres:
    image: postgres:16-alpine
    container_name: mydivelog-postgres
    environment:
      POSTGRES_DB: mydivelog
      POSTGRES_USER: mydivelog
      POSTGRES_PASSWORD: mydivelog
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydivelog -d mydivelog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
