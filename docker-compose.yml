# Local development stack. Brought up by `pnpm dev` (or `pnpm services:up`).
#
# Nothing here is production shaped: production uses managed Postgres (Neon)
# and Cloudflare R2. MinIO stands in for R2 locally because both speak S3.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mydivelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydivelog
      POSTGRES_PASSWORD: mydivelog
      POSTGRES_DB: mydivelog
    ports:
      # Non-default host port: 5432 is routinely occupied by a system Postgres
      # or another project's stack. Override with POSTGRES_PORT in .env.
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-d` matters: without it pg_isready checks the default database and
      # reports ready before ours exists.
      test: ['CMD-SHELL', 'pg_isready -U mydivelog -d mydivelog']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes public images (quay.io/minio/* now refuses
  # anonymous pulls), so this is Chainguard's free build of the same server.
  # It is distroless: no shell and no `mc`, hence no healthcheck here.
  # minio-init below polls until the server answers instead.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mydivelog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mydivelog
      MINIO_ROOT_PASSWORD: mydivelog-dev-secret
    ports:
      # 9000 collides with plenty of things; see the note on Postgres above.
      - '${MINIO_PORT:-59000}:9000'
      - '${MINIO_CONSOLE_PORT:-59001}:9001'
    volumes:
      - minio-data:/data

  # Waits for MinIO, creates the buckets the app expects, then exits.
  # `pnpm services:up` waits for this to complete, so a fresh clone has
  # working storage immediately.
  minio-init:
    image: amazon/aws-cli:latest
    container_name: mydivelog-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: mydivelog
      AWS_SECRET_ACCESS_KEY: mydivelog-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
      tries=0;
      until aws s3api list-buckets > /dev/null 2>&1; do
        tries=$$((tries + 1));
        if [ $$tries -ge 60 ]; then echo 'minio did not come up'; exit 1; fi;
        sleep 1;
      done;
      for b in mydivelog-uploads mydivelog-profiles mydivelog-exports; do
        aws s3api head-bucket --bucket $$b > /dev/null 2>&1 ||
        aws s3api create-bucket --bucket $$b > /dev/null || exit 1;
      done;
      echo 'buckets ready'
      "

volumes:
  postgres-data:
  minio-data:
